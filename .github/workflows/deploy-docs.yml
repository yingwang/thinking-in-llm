name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/deploy-docs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install \
            "mkdocs-material>=9.5" \
            "pymdown-extensions>=10.7" \
            "mkdocs>=1.6" \
            "mdx-truly-sane-lists>=1.3"

      - name: Assemble docs/ from chapters/ + en/
        run: |
          mkdir -p docs/chapters docs/en/chapters
          cp README.md docs/README.md
          cp OUTLINE.md docs/OUTLINE.md
          cp -r chapters/. docs/chapters/
          cp en/README.md docs/en/README.md
          cp en/OUTLINE.md docs/en/OUTLINE.md
          cp en/GLOSSARY.md docs/en/GLOSSARY.md
          cp -r en/chapters/. docs/en/chapters/

      - name: Build site
        run: mkdocs build --site-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
