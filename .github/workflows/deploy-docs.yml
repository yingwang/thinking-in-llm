name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('.github/workflows/deploy-docs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install \
            "mkdocs-material>=9.5" \
            "pymdown-extensions>=10.7" \
            "mkdocs>=1.6" \
            "mdx-truly-sane-lists>=1.3"

      - name: Assemble docs/ from chapters/ + en/
        run: |
          mkdir -p docs/chapters docs/en/chapters docs/javascripts docs/stylesheets
          # 站点默认语言是英文：根首页取自 en/README.md，中文首页放在 docs/zh.md。
          # docs/README.md 不能再用，mkdocs 会判定它与 index.md 冲突并整页排除。
          cp en/README.md docs/index.md
          cp en/README.md docs/en/README.md
          cp en/OUTLINE.md docs/en/OUTLINE.md
          cp en/GLOSSARY.md docs/en/GLOSSARY.md
          cp -r en/chapters/. docs/en/chapters/
          cp README.md docs/zh.md
          cp OUTLINE.md docs/OUTLINE.md
          cp -r chapters/. docs/chapters/
          # 根首页原本以 en/ 为基准写的相对链接，挪到根目录后要补前缀，否则会指到中文章节
          sed -i -E 's#\]\((chapters/|GLOSSARY\.md|OUTLINE\.md)#](en/\1#g' docs/index.md
          sed -i -E 's#\[中文\]\(\.\./README\.md\)#[中文](zh.md)#; s#\[English\]\(README\.md\)#[English](index.md)#' docs/index.md
          # 中文章节页脚的「目录」原本回到 docs/README.md，现在指向 docs/zh.md
          sed -i 's#\](\.\./README\.md)#](../zh.md)#g' docs/chapters/*.md
          sed -i 's#\](\.\./README\.md)#](../zh.md)#' docs/en/README.md
          cp javascripts/mathjax.js docs/javascripts/mathjax.js
          cp stylesheets/extra.css docs/stylesheets/extra.css

      - name: Insert blank line before lazy lists (GitHub-style)
        run: |
          python3 - <<'EOF'
          import re, pathlib
          LIST_LIKE = re.compile(r'^\s*(?:-|\d+\.)\s')
          for p in pathlib.Path('docs').rglob('*.md'):
              lines = p.read_text().split('\n')
              out = []
              in_fence = False
              for line in lines:
                  stripped = line.lstrip()
                  if stripped.startswith('```') or stripped.startswith('~~~'):
                      in_fence = not in_fence
                  elif (not in_fence
                        and LIST_LIKE.match(line)
                        and out and out[-1].strip()
                        and not LIST_LIKE.match(out[-1])):
                      out.append('')
                  out.append(line)
              p.write_text('\n'.join(out))
          EOF

      - name: Build site
        run: mkdocs build --site-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
